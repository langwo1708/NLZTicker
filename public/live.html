<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#166534"><link rel="icon" href="NLZ.jpg" type="image/jpeg"><link rel="stylesheet" href="styles.css"><title>Live-Spielstand</title></head><body><header><div class="head"><div class="brand"><img src="NLZ.jpg" alt="NLZ Logo" class="brand-logo"><h1>⚽ Live-Spielstand</h1></div><span id="updated" class="small">wird geladen</span></div></header><main class="wrap"><div class="card score"><div id="title">Spiel wird geladen …</div><div class="scoreline" id="score">- : -</div><div class="clock" id="clock">00:00</div><div class="muted" id="status"></div></div><div class="card"><h2>Spielverlauf</h2><div id="events"></div></div><div class="card"><h2>Torschützen</h2><div id="scorers"></div></div></main><script>let last=null;const id=new URLSearchParams(location.search).get('id');const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const elapsed=m=>m.timer.elapsedSeconds+(m.timer.running?Math.max(0,Math.floor((Date.now()-m.timer.startedAt)/1000)):0);const scores=m=>m.events.reduce((a,e)=>(e.type==='own'?a[0]++:a[1]++,a),[0,0]);const eventText=e=>{let n=e.playerName?((e.shirtNumber?'#'+e.shirtNumber+' ':'')+e.playerName):(e.type==='own'?'Eigenes Tor':'Tor Gegner');return `${e.minute}. ${e.type==='own'?'⚽ ':'🔴 '}${esc(n)}`};async function load(){try{let r=await fetch('/api/public-live?id='+encodeURIComponent(id),{cache:'no-store'}),m=await r.json();if(!r.ok)throw Error(m.error);last=m;render();updated.textContent='aktualisiert '+new Date().toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}catch(e){status.textContent=e.message}}function render(){let m=last,s=scores(m);title.textContent=m.teamName+' – '+m.opponent;score.textContent=s.join(' : ');clock.textContent=fmt(elapsed(m));status.textContent=m.status==='finished'?'Beendet':m.timer.running?'Läuft':'Pausiert';events.innerHTML=m.events.slice().reverse().map(e=>`<div class="row"><span>${eventText(e)}</span></div>`).join('')||'<div class="empty">Noch keine Tore</div>';let x={};m.events.filter(e=>(e.type==='own'||e.type==='opponent')&&(e.playerName||e.shirtNumber)).forEach(e=>{let k=e.type+'|'+(e.playerName||'')+'|'+(e.shirtNumber??'');x[k]??={name:e.playerName||'Unbekannt',no:e.shirtNumber,n:0,mins:[],side:e.type};x[k].n++;x[k].mins.push(e.minute)});scorers.innerHTML=Object.values(x).sort((a,b)=>b.n-a.n).map((p,i)=>`<div class="rank"><b>${i+1}.</b><span><b>${p.no!==null&&p.no!==undefined&&p.no!==''?'#'+esc(p.no)+' ':''}${esc(p.name)}</b>${p.side==='opponent'?' <span class="badge opp">Gegner</span>':''}<br><span class="muted small">${p.mins.join('., ')}. Minute</span></span><b>${p.n} ⚽</b></div>`).join('')||'<div class="empty">Noch keine Torschützen</div>'}setInterval(()=>{if(last)clock.textContent=fmt(elapsed(last))},500);setInterval(load,4000);load();</script></body></html>
