<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#166534"><link rel="icon" href="NLZ.jpg" type="image/jpeg"><link rel="stylesheet" href="styles.css"><title>Live-Spielstand</title></head><body><header><div class="head"><div class="brand"><img src="NLZ.jpg" alt="NLZ Logo" class="brand-logo"><h1>⚽ Live-Spielstand</h1></div><span id="updated" class="small">wird geladen</span></div></header><main class="wrap"><div class="card score"><div id="title">Spiel wird geladen …</div><div class="scoreline" id="score">- : -</div><div class="clock" id="clock">00:00</div><div class="muted" id="status"></div></div><div class="card"><h2>Spielverlauf</h2><div id="events"></div></div><div class="card"><h2>Torschützen</h2><div id="scorers"></div></div></main><script>let last=null;const id=new URLSearchParams(location.search).get('id');const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const teamBadge=(name,side)=>name?` <span class="badge${side==='opponent'?' opp':''}">${esc(name)}</span>`:'';const elapsed=m=>m.timer.elapsedSeconds+(m.timer.running?Math.max(0,Math.floor((Date.now()-m.timer.startedAt)/1000)):0);const scores=m=>m.events.reduce((a,e)=>(e.type==='own'?a[0]++:a[1]++,a),[0,0]);const eventText=e=>{let n=e.playerName?((e.shirtNumber?'#'+e.shirtNumber+' ':'')+e.playerName):(e.type==='own'?'Eigenes Tor':'Tor');return `${e.minute}. ${e.type==='own'?'⚽ ':'🔴 '}${e.teamName?teamBadge(e.teamName,e.type).trimStart()+': ':''}${esc(n)}`};const playerLabel=p=>p&&p.name?((p.no!==null&&p.no!==undefined&&p.no!==''?'#'+p.no+' ':'')+p.name):'Unbekannt';const subSec=s=>s.elapsedSeconds!=null?Math.max(0,+s.elapsedSeconds||0):Math.max(0,(+s.minute||1)-1)*60;const eventSec=e=>e.elapsedSeconds!=null?Math.max(0,+e.elapsedSeconds||0):Math.max(0,(+e.minute||1)-1)*60;const subText=s=>{let side=s.side==='opponent'?'opponent':'own',team=s.teamName?teamBadge(s.teamName,side):` ${esc(side==='opponent'?'Gegner':'Wir')}`;return `🔄${team}: ${esc(playerLabel(s.outPlayer))} raus, ${esc(playerLabel(s.inPlayer))} rein`};const timeline=m=>[...(m.events||[]).map(e=>({kind:'goal',...e,teamName:e.type==='own'?m.teamName:m.opponent})),...(m.substitutions||[]).map(s=>({kind:'sub',...s,teamName:s.side==='opponent'?m.opponent:m.teamName}))].sort((a,b)=>{let d=(a.kind==='goal'?eventSec(a):subSec(a))-(b.kind==='goal'?eventSec(b):subSec(b));return d||String(a.createdAt||'').localeCompare(String(b.createdAt||''))});async function load(){try{let r=await fetch('/api/public-live?id='+encodeURIComponent(id),{cache:'no-store'}),m=await r.json();if(!r.ok)throw Error(m.error);last=m;render();updated.textContent='aktualisiert '+new Date().toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}catch(e){status.textContent=e.message}}function render(){let m=last,s=scores(m);title.textContent=m.teamName+' – '+m.opponent;score.textContent=s.join(' : ');clock.textContent=fmt(elapsed(m));status.textContent=m.status==='finished'?'Beendet':m.timer.running?'Läuft':'Pausiert';events.innerHTML=timeline(m).slice().reverse().map(x=>x.kind==='goal'?`<div class="row"><span>${eventText(x)}</span></div>`:`<div class="row"><span>${x.minute}. ${subText(x)}</span></div>`).join('')||'<div class="empty">Noch keine Tore oder Wechsel</div>';let x={};m.events.filter(e=>(e.type==='own'||e.type==='opponent')&&(e.playerName||e.shirtNumber)).forEach(e=>{let tn=e.type==='own'?m.teamName:m.opponent,k=e.type+'|'+(tn||'')+'|'+(e.playerName||'')+'|'+(e.shirtNumber??'');x[k]??={name:e.playerName||'Unbekannt',no:e.shirtNumber,n:0,mins:[],side:e.type,teamName:tn};x[k].n++;x[k].mins.push(e.minute)});scorers.innerHTML=Object.values(x).sort((a,b)=>b.n-a.n).map((p,i)=>`<div class="rank"><b>${i+1}.</b><span><b>${p.no!==null&&p.no!==undefined&&p.no!==''?'#'+esc(p.no)+' ':''}${esc(p.name)}</b>${teamBadge(p.teamName,p.side)}<br><span class="muted small">${p.mins.join('., ')}. Minute</span></span><b>${p.n} ⚽</b></div>`).join('')||'<div class="empty">Noch keine Torschützen</div>'}setInterval(()=>{if(last)clock.textContent=fmt(elapsed(last))},500);setInterval(load,4000);load();</script></body></html>
